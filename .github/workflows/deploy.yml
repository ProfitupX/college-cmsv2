name: Deploy College CMS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Automated Quality & Integrity Verification
        run: npm run verify

      # Requirement 1 & 2: Run automatic smoke tests & block deployment if any error exists
      - name: Run Smoke Tests (Deployment Block Gate)
        run: npm run test:smoke

      - name: Build frontend bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          ls -la dist/
          ls -la dist/assets/

      - name: Transfer dist, server, and deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/,server/,scripts/deploy_vps.sh"
          target: "/tmp/markhub_dist"
          overwrite: true

      - name: Deploy, Health Check & Process Reload via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          VPS_PATH: ${{ secrets.VPS_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_PATH
          command_timeout: 5m
          script: |
            chmod +x /tmp/markhub_dist/scripts/deploy_vps.sh 2>/dev/null || true
            chmod +x /tmp/markhub_dist/deploy_vps.sh 2>/dev/null || true
            if [ -f "/tmp/markhub_dist/scripts/deploy_vps.sh" ]; then
              bash /tmp/markhub_dist/scripts/deploy_vps.sh
            elif [ -f "/tmp/markhub_dist/deploy_vps.sh" ]; then
              bash /tmp/markhub_dist/deploy_vps.sh
            else
              echo "Deploy script not found!" && exit 1
            fi

      # Requirement 5: Notify Administrators on Failure
      - name: Notify Administrators on Deployment Block or Failure
        if: failure()
        run: |
          echo "🚨 Deployment blocked by smoke tests or auto-rolled back on server. Administrators alerted."
