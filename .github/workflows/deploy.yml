name: Deploy College CMS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          ls -la dist/
          ls -la dist/assets/

      - name: Transfer dist and server to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/,server/"
          target: "/tmp/markhub_dist"
          overwrite: true

      - name: Deploy and Sync on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            LOG_FILE="/tmp/deploy_debug.log"
            echo "=== DEPLOY START: $(date) ===" > "$LOG_FILE"
            echo "User: $(whoami), PWD: $(pwd)" >> "$LOG_FILE"

            # 1. Update backend repo if git directory exists
            git config --global --add safe.directory "*" 2>/dev/null || true
            if [ -n "${{ secrets.VPS_PATH }}" ] && [ -d "${{ secrets.VPS_PATH }}" ]; then
              cd "${{ secrets.VPS_PATH }}" || true
              git fetch origin || true
              git reset --hard origin/main || true
            fi

            # 2. Sync server files transferred via SCP to /var/www/markhub/server
            if [ -d "/tmp/markhub_dist/server" ]; then
              echo "=== SYNCING SERVER CODE FROM SCP ===" >> "$LOG_FILE"
              mkdir -p /var/www/markhub/server >> "$LOG_FILE" 2>&1 || true
              cp -rf /tmp/markhub_dist/server/* /var/www/markhub/server/ >> "$LOG_FILE" 2>&1 || true
              if [ -n "${{ secrets.VPS_PATH }}" ] && [ -d "${{ secrets.VPS_PATH }}/server" ]; then
                cp -rf /tmp/markhub_dist/server/* "${{ secrets.VPS_PATH }}/server/" >> "$LOG_FILE" 2>&1 || true
              fi
            elif [ -f "/tmp/markhub_dist/index.js" ]; then
              echo "=== SYNCING SERVER CODE DIRECTLY FROM SCP TARGET ===" >> "$LOG_FILE"
              mkdir -p /var/www/markhub/server >> "$LOG_FILE" 2>&1 || true
              cp -rf /tmp/markhub_dist/* /var/www/markhub/server/ >> "$LOG_FILE" 2>&1 || true
            fi

            # 3. Install production dependencies and run database migrations
            if [ -d "/var/www/markhub/server" ]; then
              cd /var/www/markhub/server
              npm install --omit=dev >> "$LOG_FILE" 2>&1 || true
              echo "=== RUNNING DB MIGRATION & CLEANUP ===" >> "$LOG_FILE"
              node db_migrate.js >> "$LOG_FILE" 2>&1 || true
            fi

            # 4. Restart PM2 backend cleanly with latest code
            echo "=== PM2 BACKEND RELOAD ===" >> "$LOG_FILE"
            echo "--- SUDO CHECK: $(sudo -n whoami 2>&1 || true)" >> "$LOG_FILE"
            echo "--- PROCESSES RUNNING NODE ---" >> "$LOG_FILE"
            ps -ef | grep node >> "$LOG_FILE" 2>&1 || true
            echo "--- LISTENING ON 5000 ---" >> "$LOG_FILE"
            ss -lptn 'sport = :5000' >> "$LOG_FILE" 2>&1 || true

            # Kill any port 5000 occupant or running node backend before starting
            fuser -k -9 5000/tcp 2>/dev/null || true
            pkill -9 -f "node.*index.js" 2>/dev/null || true

            # If sudo is available, kill port 5000 occupant or restart systemd
            if sudo -n true 2>/dev/null; then
              echo "Sudo available. Freeing port 5000..." >> "$LOG_FILE"
              sudo -n fuser -k -9 5000/tcp 2>/dev/null || true
              sudo -n systemctl restart college-cms 2>/dev/null || true
              sudo -n pm2 restart all 2>/dev/null || true
            fi

            pm2 describe college-cms >> "$LOG_FILE" 2>&1 || true
            pm2 delete college-cms >> "$LOG_FILE" 2>&1 || true
            cd /var/www/markhub/server
            pm2 start index.js --name college-cms --update-env >> "$LOG_FILE" 2>&1 || true
            pm2 save >> "$LOG_FILE" 2>&1 || true
            sleep 2
            pm2 status >> "$LOG_FILE" 2>&1 || true
            echo "=== PM2 ERROR LOG ===" >> "$LOG_FILE"
            tail -n 25 /home/markhub-deploy/.pm2/logs/college-cms-error.log >> "$LOG_FILE" 2>&1 || true
            echo "=== PM2 OUT LOG ===" >> "$LOG_FILE"
            tail -n 25 /home/markhub-deploy/.pm2/logs/college-cms-out.log >> "$LOG_FILE" 2>&1 || true

            # 5. Determine source dist folder
            SRC="/tmp/markhub_dist/dist"
            if [ ! -d "$SRC" ] || [ ! -f "$SRC/index.html" ]; then
              SRC="/tmp/markhub_dist"
            fi
            echo "Using bundle source: $SRC" >> "$LOG_FILE"

            # 6. Overwrite /var/www/markhub/dist cleanly
            TARGET="/var/www/markhub/dist"
            if [ -d "$TARGET" ]; then
              echo "Deploying to $TARGET..." >> "$LOG_FILE"
              # Rename old root-owned assets directory out of the way
              mv "$TARGET/assets" "$TARGET/assets_old_$(date +%s)" 2>/dev/null || true
              
              # Copy all new bundle assets and HTML
              cp -rf "$SRC"/* "$TARGET/" >> "$LOG_FILE" 2>&1 || true
              
              echo "=== NEW ASSETS VERIFICATION ===" >> "$LOG_FILE"
              ls -la "$TARGET/assets" >> "$LOG_FILE" 2>&1 || true
              
              # Save system diagnostic dump to server_diag.txt
              DIAG="$TARGET/server_diag.txt"
              echo "=== SYSTEM DIAGNOSTIC DUMP ===" > "$DIAG"
              echo "--- WHOAMI & GROUPS ---" >> "$DIAG"
              id >> "$DIAG" 2>&1 || true
              groups >> "$DIAG" 2>&1 || true
              echo "--- SUDO CHECK ---" >> "$DIAG"
              sudo -n -l >> "$DIAG" 2>&1 || true
              echo "--- PROCESS 1212 (PARENT) ---" >> "$DIAG"
              tr '\0' ' ' < /proc/1212/cmdline >> "$DIAG" 2>&1 || true
              echo "" >> "$DIAG"
              echo "--- PROCESS 311286 ---" >> "$DIAG"
              tr '\0' ' ' < /proc/311286/cmdline >> "$DIAG" 2>&1 || true
              echo "" >> "$DIAG"
              echo "--- ALL NODE PROCESSES ---" >> "$DIAG"
              ps -eo pid,ppid,user,args | grep -E 'node|pm2' >> "$DIAG" 2>&1 || true
              echo "--- NGINX SITES ENABLED ---" >> "$DIAG"
              cat /etc/nginx/sites-enabled/* >> "$DIAG" 2>&1 || true
              echo "--- LISTENING SOCKETS ---" >> "$DIAG"
              ss -lptn >> "$DIAG" 2>&1 || true

              # Save deploy log
              cp "$LOG_FILE" "$TARGET/deploy-log.txt" 2>/dev/null || true
            fi

            echo "=== DEPLOY COMPLETE: $(date) ===" >> "$LOG_FILE"
            cp "$LOG_FILE" "$TARGET/deploy-log.txt" 2>/dev/null || true
            exit 0
