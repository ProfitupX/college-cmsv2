name: Deploy College CMS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          ls -la dist/

      - name: Transfer dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/markhub_dist"
          overwrite: true

      - name: Deploy and Sync on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            LOG_FILE="/tmp/deploy_debug.log"
            echo "=== DEPLOY START: $(date) ===" | sudo tee "$LOG_FILE"

            # 1. Update backend repo & seed database
            cd ${{ secrets.VPS_PATH }} || true
            git fetch origin || true
            git reset --hard origin/main || true
            node server/seed_all_first_year.js 2>&1 | sudo tee -a "$LOG_FILE" || true

            # 2. Restart backend
            pm2 restart all 2>&1 | sudo tee -a "$LOG_FILE" || sudo pm2 restart all 2>&1 | sudo tee -a "$LOG_FILE" || pm2 start server/index.js --name "college-cms" || true

            # 3. Determine source dist folder
            SRC="/tmp/markhub_dist/dist"
            if [ ! -d "$SRC" ] || [ ! -f "$SRC/index.html" ]; then
              SRC="/tmp/markhub_dist"
            fi
            if [ ! -f "$SRC/index.html" ]; then
              echo "Building locally on VPS fallback..." | sudo tee -a "$LOG_FILE"
              cd ${{ secrets.VPS_PATH }}
              npm install --include=dev || true
              npx vite build || true
              SRC="${{ secrets.VPS_PATH }}/dist"
            fi
            echo "Using source bundle from: $SRC" | sudo tee -a "$LOG_FILE"
            ls -la "$SRC" | sudo tee -a "$LOG_FILE"

            # 4. Search ENTIRE VPS for old bundle index-DCBDcCgS.js
            echo "Searching for old bundle on VPS..." | sudo tee -a "$LOG_FILE"
            OLD_BUNDLES=$(sudo find / -name "index-DCBDcCgS.js" 2>/dev/null || true)
            echo "Found old bundle locations: $OLD_BUNDLES" | sudo tee -a "$LOG_FILE"
            for old_bundle in $OLD_BUNDLES; do
              TARGET_DIR=$(dirname $(dirname "$old_bundle"))
              echo "Syncing new dist to: $TARGET_DIR" | sudo tee -a "$LOG_FILE"
              sudo cp -r "$SRC"/* "$TARGET_DIR/"
              sudo chown -R www-data:www-data "$TARGET_DIR" 2>/dev/null || true
              sudo cp "$LOG_FILE" "$TARGET_DIR/deploy-log.txt" 2>/dev/null || true
            done

            # 5. Sync to all Nginx configured roots
            NGINX_ROOTS=$(sudo nginx -T 2>/dev/null | grep -E '^\s*root\s+' | awk '{print $2}' | tr -d ';' | sort -u || true)
            echo "Found Nginx roots: $NGINX_ROOTS" | sudo tee -a "$LOG_FILE"
            for r in $NGINX_ROOTS; do
              if [ -d "$r" ]; then
                echo "Syncing new dist to nginx root: $r" | sudo tee -a "$LOG_FILE"
                sudo cp -r "$SRC"/* "$r/"
                sudo chown -R www-data:www-data "$r" 2>/dev/null || true
                sudo cp "$LOG_FILE" "$r/deploy-log.txt" 2>/dev/null || true
              fi
            done

            # 6. Sync to standard web roots
            for std_dir in /var/www/html /var/www/college-cms /var/www/college-cms/dist /var/www/markhub /var/www/markhub/dist; do
              if [ -d "$std_dir" ]; then
                echo "Syncing new dist to standard root: $std_dir" | sudo tee -a "$LOG_FILE"
                sudo cp -r "$SRC"/* "$std_dir/"
                sudo chown -R www-data:www-data "$std_dir" 2>/dev/null || true
                sudo cp "$LOG_FILE" "$std_dir/deploy-log.txt" 2>/dev/null || true
              fi
            done

            # 7. Reload Nginx
            sudo systemctl reload nginx || sudo nginx -s reload || true
            echo "=== DEPLOY FINISHED: $(date) ===" | sudo tee -a "$LOG_FILE"
