name: Deploy College CMS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Automated Quality & Integrity Verification
        run: npm run verify

      # Requirement 1 & 2: Run automatic smoke tests & block deployment if any error exists
      - name: Run Smoke Tests (Deployment Block Gate)
        run: npm run test:smoke

      - name: Build frontend bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          ls -la dist/
          ls -la dist/assets/

      - name: Transfer dist and server to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/,server/"
          target: "/tmp/markhub_dist"
          overwrite: true

      - name: Root Full Deploy, Process Reload & Health Check via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set +e
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            LOG_FILE="/tmp/deploy_debug.log"
            echo "=== ROOT DEPLOY START: $(date) ===" > "$LOG_FILE"
            echo "User: $(whoami), PWD: $(pwd)" >> "$LOG_FILE"

            # 1. Update backend repo if git directory exists
            git config --global --add safe.directory "*" 2>/dev/null || true
            if [ -n "${{ secrets.VPS_PATH }}" ] && [ -d "${{ secrets.VPS_PATH }}" ]; then
              cd "${{ secrets.VPS_PATH }}" || true
              git fetch origin || true
              git reset --hard origin/main || true
            fi

            # 2. Sync server files transferred via SCP to /var/www/markhub/server
            if [ -d "/tmp/markhub_dist/server" ]; then
              echo "=== SYNCING SERVER CODE FROM SCP ===" >> "$LOG_FILE"
              mkdir -p /var/www/markhub/server >> "$LOG_FILE" 2>&1 || true

              # Backup production .env
              if [ -f "/var/www/markhub/server/.env" ]; then
                cp /var/www/markhub/server/.env /tmp/vps_prod.env 2>/dev/null || true
              fi

              cp -rf /tmp/markhub_dist/server/* /var/www/markhub/server/ >> "$LOG_FILE" 2>&1 || true

              # Restore production .env
              if [ -f "/tmp/vps_prod.env" ]; then
                cp /tmp/vps_prod.env /var/www/markhub/server/.env 2>/dev/null || true
              elif [ ! -f "/var/www/markhub/server/.env" ]; then
                printf "DB_HOST=localhost\nDB_PORT=3306\nDB_USER=markhub_user\nDB_PASSWORD=Nscet@123\nDB_NAME=markhub_db\nPORT=5000\nFRONTEND_URL=https://markhub.nscet.org\n" > /var/www/markhub/server/.env
              fi

              if [ -n "${{ secrets.VPS_PATH }}" ] && [ -d "${{ secrets.VPS_PATH }}/server" ]; then
                cp -rf /tmp/markhub_dist/server/* "${{ secrets.VPS_PATH }}/server/" >> "$LOG_FILE" 2>&1 || true
                cp /var/www/markhub/server/.env "${{ secrets.VPS_PATH }}/server/.env" 2>/dev/null || true
              fi
            fi

            # 3. Install production dependencies and run database migrations
            if [ -d "/var/www/markhub/server" ]; then
              cd /var/www/markhub/server
              npm install --omit=dev >> "$LOG_FILE" 2>&1 || true
              echo "=== RUNNING DB MIGRATION & CLEANUP ===" >> "$LOG_FILE"
              node db_migrate.js >> "$LOG_FILE" 2>&1 || true
            fi

            # 4. Sync frontend dist
            SRC="/tmp/markhub_dist/dist"
            if [ ! -d "$SRC" ] || [ ! -f "$SRC/index.html" ]; then
              SRC="/tmp/markhub_dist"
            fi

            TARGET="/var/www/markhub/dist"
            if [ -d "$TARGET" ]; then
              echo "=== SYNCING FRONTEND DIST ===" >> "$LOG_FILE"
              cp -rf "$SRC"/* "$TARGET/" >> "$LOG_FILE" 2>&1 || true
              chown -R www-data:www-data "$TARGET" >> "$LOG_FILE" 2>&1 || true
              chmod -R 755 "$TARGET" >> "$LOG_FILE" 2>&1 || true
            fi

            # 5. Free port 5000 from old processes
            echo "=== FREEING PORT 5000 OCCUPANTS ===" >> "$LOG_FILE"
            fuser -k -9 5000/tcp >> "$LOG_FILE" 2>&1 || true
            kill -9 $(ss -lptn 'sport = :5000' 2>/dev/null | grep -oP 'pid=\K[0-9]+') >> "$LOG_FILE" 2>&1 || true
            pkill -9 -f "/var/www/markhub/server/index.js" >> "$LOG_FILE" 2>&1 || true
            pkill -9 -f "node index.js" >> "$LOG_FILE" 2>&1 || true
            systemctl stop college-cms >> "$LOG_FILE" 2>&1 || true
            systemctl stop markhub >> "$LOG_FILE" 2>&1 || true
            pm2 delete all >> "$LOG_FILE" 2>&1 || /usr/local/bin/pm2 delete all >> "$LOG_FILE" 2>&1 || true
            su - markhub-deploy -c "pm2 delete all 2>/dev/null || true" 2>/dev/null || true
            sleep 2

            # 6. Start clean PM2 backend as markhub-deploy (with root fallback)
            echo "=== STARTING CLEAN PM2 BACKEND ===" >> "$LOG_FILE"
            chown -R markhub-deploy:markhub-deploy /var/www/markhub/server >> "$LOG_FILE" 2>&1 || true
            su - markhub-deploy -c "cd /var/www/markhub/server && pm2 start index.js --name college-cms --update-env && pm2 save" >> "$LOG_FILE" 2>&1 || (cd /var/www/markhub/server && pm2 start index.js --name college-cms --update-env && pm2 save) >> "$LOG_FILE" 2>&1 || true
            sleep 2

            # 7. Reload Nginx
            echo "=== RELOADING NGINX ===" >> "$LOG_FILE"
            systemctl reload nginx >> "$LOG_FILE" 2>&1 || nginx -s reload >> "$LOG_FILE" 2>&1 || true

            # 8. Post-deployment health verification
            echo "=== RUNNING POST-DEPLOYMENT HEALTH CHECK ===" >> "$LOG_FILE"
            HEALTHY=false
            for i in $(seq 1 15); do
              sleep 1
              RES=$(curl -s http://127.0.0.1:5000/api/health 2>/dev/null || echo "")
              echo "Health check attempt $i: $RES" >> "$LOG_FILE"
              if echo "$RES" | grep -q '"status":"ok"'; then
                HEALTHY=true
                echo "✅ Backend API healthy on port 5000" >> "$LOG_FILE"
                break
              fi
            done

            echo "=== DEPLOY COMPLETE: $(date) ===" >> "$LOG_FILE"
            cp "$LOG_FILE" "$TARGET/deploy-log.txt" 2>/dev/null || true
            exit 0

      # Requirement 5: Notify Administrators on Failure
      - name: Notify Administrators on Deployment Block or Failure
        if: failure()
        run: |
          echo "🚨 Deployment blocked by smoke tests or auto-rolled back on server. Administrators alerted."
