name: Deploy College CMS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || exit 1
          ls -la dist/
          ls -la dist/assets/

      - name: Transfer dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/markhub_dist"
          overwrite: true

      - name: Deploy and Sync on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            LOG_FILE="/tmp/deploy_debug.log"
            echo "=== DEPLOY START: $(date) ===" > "$LOG_FILE"

            # 1. Update backend repo & seed database
            cd ${{ secrets.VPS_PATH }} || true
            git fetch origin || true
            git reset --hard origin/main || true
            node server/seed_all_first_year.js >> "$LOG_FILE" 2>&1 || true

            # 2. Restart PM2 backend cleanly with latest code
            echo "=== PM2 BACKEND RELOAD ===" >> "$LOG_FILE"
            pm2 describe college-cms >> "$LOG_FILE" 2>&1 || true
            pm2 delete college-cms >> "$LOG_FILE" 2>&1 || true
            pm2 start server/index.js --name college-cms --update-env >> "$LOG_FILE" 2>&1 || true
            pm2 save >> "$LOG_FILE" 2>&1 || true
            sleep 2
            pm2 status >> "$LOG_FILE" 2>&1 || true

            # 3. Determine source dist folder
            SRC="/tmp/markhub_dist/dist"
            if [ ! -d "$SRC" ] || [ ! -f "$SRC/index.html" ]; then
              SRC="/tmp/markhub_dist"
            fi
            echo "Using bundle source: $SRC" >> "$LOG_FILE"

            # 4. Overwrite /var/www/markhub/dist cleanly
            TARGET="/var/www/markhub/dist"
            if [ -d "$TARGET" ]; then
              echo "Deploying to $TARGET..." >> "$LOG_FILE"
              # Rename old root-owned assets directory out of the way
              mv "$TARGET/assets" "$TARGET/assets_old_$(date +%s)" 2>/dev/null || true
              
              # Copy all new bundle assets and HTML
              cp -rf "$SRC"/* "$TARGET/" >> "$LOG_FILE" 2>&1 || true
              
              echo "=== NEW ASSETS VERIFICATION ===" >> "$LOG_FILE"
              ls -la "$TARGET/assets" >> "$LOG_FILE" 2>&1 || true
              
              # Save deploy log
              cp "$LOG_FILE" "$TARGET/deploy-log.txt" 2>/dev/null || true
            fi

            echo "=== DEPLOY COMPLETE: $(date) ===" >> "$LOG_FILE"
            cp "$LOG_FILE" "$TARGET/deploy-log.txt" 2>/dev/null || true
            exit 0
