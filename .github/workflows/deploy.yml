
name: Deploy MarkHub to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        default: ''

concurrency:
  group: markhub-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Verify and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate Manual Deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ github.event.inputs.confirm_deployment }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "Deployment confirmation failed."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Verify Frontend
        run: |
          set -e
          test -s dist/index.html
          assets=$(grep -oE '(src|href)="(/assets/[^"]+)"' dist/index.html | sed -E 's/^(src|href)="\/assets\///; s/"$//' | sort -u)
          test -n "$assets"
          for asset in $assets; do
            test -s "dist/assets/$asset"
          done

      - name: Verify Backend
        run: |
          set -e
          test -s server/index.js
          test -s server/package.json
          test -s server/package-lock.json
          test -s server/routes/auth.js
          test -s server/routes/subjects.js

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure Known Hosts
        env:
          KNOWN_HOSTS_DATA: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -e
          test -n "$KNOWN_HOSTS_DATA"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS_DATA" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify Production Service
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          test -n "$VPS_HOST"

          ssh -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s" < scripts/inspect_service.sh

      - name: Transfer Complete Application
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /tmp/markhub_dist/dist /tmp/markhub_dist/server'

          rsync -az --delete \
            dist/ \
            "$VPS_USER@$VPS_HOST:/tmp/markhub_dist/dist/"

          rsync -az --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='*.pem' \
            --exclude='*.key' \
            server/ \
            "$VPS_USER@$VPS_HOST:/tmp/markhub_dist/server/"

      - name: Execute Protected Deployment
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "MARKHUB_SERVICE_TYPE=pm2 MARKHUB_SERVICE_NAME=markhub-server MARKHUB_APP_ROOT=/var/www/markhub MARKHUB_STAGING_DIR=/tmp/markhub_dist bash -s" \
            < scripts/deploy_vps.sh
