name: Deploy to Production VPS

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type "DEPLOY" to confirm production deployment'
        required: true
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Verify and Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate Manual Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deployment }}" != "DEPLOY" ]; then
            echo "❌ Deployment aborted: Input confirmation was not 'DEPLOY'."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Verify Built Frontend Assets
        run: |
          [ -s dist/index.html ] || { echo "dist/index.html missing"; exit 1; }
          assets=$(grep -oE '(src|href)="(/assets/[^"]+)"' dist/index.html | sed -E 's/^(src|href)="\/assets\///; s/"$//' | sort -u)
          [ -n "$assets" ] || { echo "No assets referenced in index.html"; exit 1; }
          for asset in $assets; do
            [ -s "dist/assets/$asset" ] || { echo "Missing asset: dist/assets/$asset"; exit 1; }
          done
          echo "✅ All referenced JS and CSS frontend assets verified."

      - name: Verify Backend Integrity
        run: |
          [ -s server/index.js ] || { echo "server/index.js missing"; exit 1; }
          [ -s server/package.json ] || { echo "server/package.json missing"; exit 1; }
          [ -s server/package-lock.json ] || { echo "server/package-lock.json missing"; exit 1; }
          echo "✅ Backend files verified."

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure Known Hosts
        env:
          KNOWN_HOSTS_DATA: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$KNOWN_HOSTS_DATA" ]; then
            echo "❌ VPS_SSH_KNOWN_HOSTS secret is empty or not set."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$KNOWN_HOSTS_DATA" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "✅ SSH known_hosts configured securely with pre-verified host key."

      - name: Verify Service Ownership on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "MARKHUB_SERVICE_TYPE=${{ secrets.MARKHUB_SERVICE_TYPE }} MARKHUB_SERVICE_NAME=${{ secrets.MARKHUB_SERVICE_NAME }} bash -s" < scripts/inspect_service.sh

      - name: Transfer Staging Artifacts to VPS
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /tmp/markhub_dist/dist /tmp/markhub_dist/server"
          scp -o StrictHostKeyChecking=yes -r dist/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/markhub_dist/dist/
          scp -o StrictHostKeyChecking=yes -r server/index.js server/package.json server/package-lock.json ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/markhub_dist/server/

      - name: Execute Deployment on VPS
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "MARKHUB_SERVICE_TYPE=${{ secrets.MARKHUB_SERVICE_TYPE }} MARKHUB_SERVICE_NAME=${{ secrets.MARKHUB_SERVICE_NAME }} bash -s" < scripts/deploy_vps.sh

      - name: Clean Up Remote Staging Directory
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "rm -rf /tmp/markhub_dist"
